<style>
:root{--bg:#090b10;--panel:#10131b;--panel2:#141925;--line:#252b39;--muted:#8791a5;--text:#edf1f8;--purple:#9274ff;--cyan:#65d8d0;--green:#53cf9a;--red:#f17b85}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}.app{display:flex;min-height:100vh}.sidebar{width:248px;background:#0d1017;border-right:1px solid var(--line);padding:18px 13px;display:flex;flex-direction:column;flex-shrink:0}.brand{display:flex;align-items:center;gap:10px;padding:4px 9px 24px;font-size:16px;font-weight:700;letter-spacing:.2px}.logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#9c7cff,#5a45ce);display:grid;place-items:center;font-weight:900;color:white;box-shadow:0 5px 24px #8065ff55}.workspace{margin:0 4px 20px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#121722}.ws-label,.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}.ws-name{margin-top:6px;font-weight:600;display:flex;justify-content:space-between}.nav-label{padding:12px 10px 7px;color:#687287;font-size:10px;letter-spacing:1.3px;text-transform:uppercase}.nav button{width:100%;border:0;background:none;color:#aab2c2;text-align:left;padding:10px 11px;border-radius:8px;display:flex;gap:12px;align-items:center;margin:2px 0;font-size:13px}.nav button:hover,.nav button.active{background:#1b2030;color:#fff}.nav button.active{box-shadow:inset 2px 0 var(--purple)}.ico{width:17px;text-align:center;color:#929bb0}.nav .count{margin-left:auto;font-size:10px;color:#8f98aa;background:#242b3a;padding:2px 7px;border-radius:20px}.sidebar-bottom{margin-top:auto}.profile{border-top:1px solid var(--line);padding:14px 6px 2px;display:flex;align-items:center;gap:10px}.avatar{width:30px;height:30px;border-radius:50%;background:#32415b;display:grid;place-items:center;font-size:11px}.profile small{display:block;color:var(--muted);margin-top:2px}.main{min-width:0;flex:1}.topbar{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:#0b0e14}.crumb{color:#a0a9ba}.crumb b{color:#f4f5fa}.top-actions{display:flex;gap:10px;align-items:center}.pill{border:1px solid var(--line);border-radius:20px;padding:7px 11px;color:#aeb7c7;font-size:11px}.btn{border:1px solid var(--line);background:#171d29;border-radius:8px;padding:9px 13px;font-size:12px}.btn:hover{border-color:#7660dc}.btn.primary{background:#765be8;border-color:#856df1;color:white;font-weight:600}.btn.ghost{background:transparent}.content{padding:30px;max-width:1500px;margin:auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:25px}.page-head h1{font-size:25px;margin:0 0 7px;letter-spacing:-.6px}.sub{color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}.stat,.panel,.agent-card{background:var(--panel);border:1px solid var(--line);border-radius:12px}.stat{padding:17px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.stat-value{font-size:26px;font-weight:650;margin:13px 0 5px}.positive{color:var(--green);font-size:11px}.dashboard-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px}.panel{padding:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.panel h3{font-size:14px;margin:0}.panel-sub{color:var(--muted);font-size:11px;margin-top:5px}.activity{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid #202634}.activity:first-of-type{border-top:0}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px #53cf9a66}.activity strong{font-size:12px}.activity small{display:block;color:var(--muted);margin-top:4px;font-size:11px}.activity time{margin-left:auto;color:#737e92;font-size:10px}.bars{height:145px;display:flex;align-items:end;gap:12px;padding:12px 6px 0;border-bottom:1px solid var(--line)}.bar{flex:1;background:linear-gradient(180deg,#987cff,#5e4ab9);border-radius:5px 5px 0 0;min-width:10px;opacity:.85}.bar-labels{display:flex;justify-content:space-around;color:var(--muted);font-size:10px;margin-top:8px}.agent-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.agent-card{padding:17px;cursor:pointer;transition:.15s}.agent-card:hover{border-color:#7160c7;transform:translateY(-2px)}.agent-icon{width:36px;height:36px;border-radius:10px;background:#24203b;color:#b6a6ff;display:grid;place-items:center;font-size:17px;margin-bottom:14px}.agent-card h3{margin:0 0 6px;font-size:14px}.agent-card p{color:var(--muted);font-size:11px;line-height:1.5;min-height:34px}.meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}.status{color:var(--green)}.tag{font-size:10px;color:#b7a8ff;background:#292342;border-radius:20px;padding:4px 8px}.toolbar{display:flex;gap:9px;margin-bottom:17px;align-items:center}.search{background:#111621;border:1px solid var(--line);border-radius:8px;color:white;padding:9px 12px;min-width:220px;outline:none}.search:focus,input:focus,textarea:focus,select:focus{border-color:#8069e9!important;outline:none}.editor-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:15px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{margin-bottom:15px}.field label{display:block;color:#aab4c6;font-size:11px;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;background:#0c111a;border:1px solid #2a3242;border-radius:7px;padding:10px;color:#e9edf6;font-size:12px}.field textarea{min-height:95px;resize:vertical;line-height:1.5}.field.full{grid-column:1/-1}.switch-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);font-size:12px}.switch{width:32px;height:18px;border-radius:20px;background:#394154;position:relative;cursor:pointer}.switch:after{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:white;top:3px;left:3px;transition:.15s}.switch.on{background:#7058db}.switch.on:after{left:17px}.canvas{height:540px;position:relative;overflow:hidden;background-color:#0b1018;background-image:radial-gradient(#30394a 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:12px}.node{position:absolute;width:180px;background:#171e2a;border:1px solid #39445a;border-radius:10px;padding:12px;box-shadow:0 12px 30px #0005;cursor:grab}.node b{font-size:12px}.node small{display:block;color:var(--muted);font-size:10px;margin-top:7px}.node .node-type{font-size:9px;color:#a996ff;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}.connector{position:absolute;height:2px;background:#7664c8;transform-origin:left center;opacity:.8}.canvas-tools{display:flex;gap:8px;margin-bottom:12px}.chatbox{height:460px;display:flex;flex-direction:column}.chat-messages{flex:1;overflow:auto;padding:10px}.bubble{max-width:80%;padding:12px;border-radius:10px;background:#1b2230;font-size:12px;line-height:1.55;margin:10px 0}.bubble.user{margin-left:auto;background:#342b5b}.chat-compose{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:14px}.chat-compose input{flex:1;background:#0c111a;border:1px solid var(--line);border-radius:8px;padding:11px;color:white}.empty{padding:50px;text-align:center;color:var(--muted)}.hidden{display:none!important}.toast{position:fixed;bottom:22px;right:24px;background:#202a3a;border:1px solid #46536c;padding:12px 16px;border-radius:9px;box-shadow:0 10px 30px #0008;z-index:9}.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:18px}.tabs button{background:none;border:0;color:var(--muted);padding:10px 2px;font-size:12px}.tabs button.active{color:white;border-bottom:2px solid var(--purple)}@media(max-width:1000px){.sidebar{width:205px}.cards{grid-template-columns:repeat(2,1fr)}.agent-grid{grid-template-columns:repeat(2,1fr)}.dashboard-grid,.editor-layout{grid-template-columns:1fr}}@media(max-width:700px){.sidebar{width:58px;padding:12px 7px}.brand{padding:5px 5px 20px}.brand span,.workspace,.nav-label,.nav button .nav-text,.nav .count,.profile div:not(.avatar){display:none}.nav button{justify-content:center;padding:12px 4px}.profile{justify-content:center}.topbar{padding:0 14px}.content{padding:20px 14px}.page-head{gap:12px}.cards{grid-template-columns:1fr 1fr}.agent-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head>
<body><div class="app">
<aside class="sidebar"><div class="brand"><div class="logo">✦</div><span>AI Studio</span></div>
<div class="workspace"><div class="ws-label">Workspace</div><div class="ws-name">My workspace <span>⌄</span></div></div>
<nav class="nav">
<div class="nav-label">Build</div>
<button class="active" data-page="overview"><span class="ico">◫</span><span class="nav-text">Overview</span></button>
<button data-page="agents"><span class="ico">✧</span><span class="nav-text">Agents</span><span class="count">6</span></button>
<button data-page="workflows"><span class="ico">⌘</span><span class="nav-text">Workflows</span></button>
<button data-page="crews"><span class="ico">♧</span><span class="nav-text">Multi-agent crews</span></button>
<div class="nav-label">Operate</div>
<button data-page="playground"><span class="ico">▷</span><span class="nav-text">Playground</span></button>
<button data-page="knowledge"><span class="ico">▤</span><span class="nav-text">Knowledge base</span></button>
<button data-page="integrations"><span class="ico">⌘</span><span class="nav-text">Integrations</span><span class="count">12</span></button>
<button data-page="schedules"><span class="ico">◷</span><span class="nav-text">Schedules & triggers</span></button>
<div class="nav-label">Discover</div>

<main class="main"><header class="topbar"><div class="crumb">Workspace <span style="color:#596477"> / </span> <b id="crumb">Overview</b></div><div class="top-actions"><span class="pill">✦ 2,450 credits</span><button class="btn ghost" id="helpBtn">? Help</button><div class="avatar">SP</div></div></header><div class="content" id="view"></div></main></div><div id="toast" class="toast hidden"></div>
<script>
const view=document.getElementById('view');let current='overview';let agents=[{name:'Research Assistant',role:'Research',desc:'Finds, evaluates and summarizes information from trusted sources.',model:'GPT-4o',status:'Active',runs:128},{name:'Customer Support Agent',role:'Support',desc:'Answers customer questions using your help centre and knowledge base.',model:'Claude Sonnet',status:'Active',runs:94},{name:'Lead Qualification',role:'Sales',desc:'Researches incoming leads and scores them against your ideal customer profile.',model:'Gemini Pro',status:'Draft',runs:36},{name:'Content Writer',role:'Marketing',desc:'Creates clear, on-brand content for campaigns and social channels.',model:'GPT-4o',status:'Active',runs:62},{name:'Data Analyst',role:'Analytics',desc:'Turns raw data into useful insights, reports and visual summaries.',model:'GPT-4o',status:'Active',runs:41},{name:'Meeting Scheduler',role:'Operations',desc:'Coordinates calendars and prepares meeting briefs.',model:'Claude Sonnet',status:'Paused',runs:18}];
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2400)}
function head(title,sub,action=''){return '<div class="page-head"><div><h1>'+title+'</h1><div class="sub">'+sub+'</div></div>'+action+'</div>'}
function stat(label,value,delta,icon){return '<div class="stat"><div class="stat-top"><span>'+label+'</span><span>'+icon+'</span></div><div class="stat-value">'+value+'</div><div class="positive">'+delta+'</div></div>'}
function agentCards(){return agents.map((a,i)=>'<div class="agent-card" data-agent="'+i+'"><div class="agent-icon">✧</div><h3>'+a.name+'</h3><span class="tag">'+a.role+'</span><p>'+a.desc+'</p><div class="meta"><span class="'+(a.status==='Active'?'status':'')+'">● '+a.status+'</span><span>'+a.model+' · '+a.runs+' runs</span></div></div>').join('')}
function dashboard(){return head('Good evening 👋','Here’s what’s happening across your AI workspace.','<button class="btn primary" data-action="new-agent">＋ Create agent</button>')+'<div class="cards">'+stat('Total agents','06','↗ 2 created this month','✧')+stat('Executions this month','1,284','↗ 18.6% vs last month','▷')+stat('Success rate','98.4%','↗ 2.1% vs last month','✓')+stat('Credits used','12,450','↘ 8% lower than average','◈')+'</div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><div><h3>Execution activity</h3><div class="panel-sub">Agent runs over the last 7 days</div></div><button class="btn">Last 7 days⌄</button></div><div class="bars">'+[45,66,53,82,61,95,72].map(h=>'<div class="bar" style="height:'+h+'%"></div>').join('')+'</div><div class="bar-labels"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div></section><section class="panel"><div class="panel-head"><div><h3>Recent activity</h3><div class="panel-sub">Latest workspace events</div></div><button class="btn ghost">View all</button></div><div class="activity"><i class="dot"></i><div><strong>Research Assistant completed a run</strong><small>Competitor landscape report generated</small></div><time>2m ago</time></div><div class="activity"><i class="dot"></i><div><strong>Customer Support Agent</strong><small>Resolved 12 customer conversations</small></div><time>18m ago</time></div><div class="activity"><i class="dot"></i><div><strong>New integration connected</strong><small>Google Drive · Knowledge source</small></div><time>1h ago</time></div><div class="activity"><i class="dot"></i><div><strong>Weekly report workflow</strong><small>Scheduled run completed</small></div><time>3h ago</time></div></section></div><section style="margin-top:24px"><div class="panel-head"><div><h3>Your agents</h3><div class="panel-sub">Quick access to your most-used agents</div></div><button class="btn" data-page="agents">View all agents →</button></div><div class="agent-grid">'+agentCards().slice(0,agents.length>3?agents.length:3)+'</div></section>'}
function agentsPage(){return head('Agents','Create, configure and manage your AI agents.','<button class="btn primary" data-action="new-agent">＋ Create agent</button>')+'<div class="toolbar"><input class="search" id="agentSearch" placeholder="⌕  Search agents..."><select class="btn" id="agentFilter"><option>All agents</option><option>Active</option><option>Draft</option><option>Paused</option></select><span class="sub" style="margin-left:auto">'+agents.length+' agents</span></div><div class="agent-grid" id="agentGrid">'+agentCards()+'</div>'}
function editor(){return head('Create an agent','Configure the identity, behaviour, model and capabilities of your agent.','<button class="btn" data-page="agents">Cancel</button> <button class="btn primary" id="saveAgent">Save agent</button>')+'<div class="editor-layout"><section class="panel"><div class="eyebrow">01 · Identity & instructions</div><h3 style="margin:9px 0 18px">Define your agent</h3><div class="field"><label>Agent name</label><input id="agentName" placeholder="e.g. Research Assistant"></div><div class="form-grid"><div class="field"><label>Role</label><input id="agentRole" placeholder="e.g. Research analyst"></div><div class="field"><label>Goal</label><input id="agentGoal" placeholder="What should it achieve?"></div><div class="field full"><label>System instructions</label><textarea id="agentPrompt" placeholder="You are a helpful AI agent. Your job is to..."></textarea></div><div class="field full"><label>First message</label><input placeholder="Hi! How can I help you today?"></div></div><div class="eyebrow" style="margin:15px 0">02 · Model & runtime</div><div class="form-grid"><div class="field"><label>AI provider</label><select><option>OpenAI</option><option>Anthropic</option><option>Google</option><option>DeepSeek</option><option>OpenRouter</option><option>Ollama</option></select></div><div class="field"><label>Model</label><select><option>GPT-4o</option><option>GPT-4.1</option><option>Claude Sonnet</option><option>Gemini 2.5 Pro</option><option>DeepSeek R1</option></select></div><div class="field"><label>Temperature</label><input type="number" value="0.7" min="0" max="2" step=".1"></div><div class="field"><label>Max tokens</label><input type="number" value="4096"></div></div></section><aside class="panel"><div class="eyebrow">03 · Capabilities</div><h3 style="margin:9px 0 12px">Tools & memory</h3>'+['Web search','Python code execution','Long-term memory','Knowledge base (RAG)','Browser automation','Generative UI'].map((x,i)=>'<div class="switch-row"><span>'+x+'</span><div class="switch '+(i<2?'on':'')+'" data-switch></div></div>').join('')+'<div class="eyebrow" style="margin:22px 0 12px">04 · Publishing</div><div class="field"><label>Visibility</label><select><option>Private — only me</option><option>Workspace</option><option>Public Agent Store</option></select></div><button class="btn" style="width:100%" id="testAgent">▷ Test in playground</button><p class="panel-sub" style="line-height:1.6">Your agent is saved as a draft until you publish it. Connect tools and add knowledge to unlock its full capabilities.</p></aside></div>'}
function workflows(){return head('Workflows','Build deterministic automations with visual nodes, conditions and loops.','<button class="btn primary" data-action="new-workflow">＋ New workflow</button>')+'<div class="panel"><div class="panel-head"><div><h3>Visual workflow builder</h3><div class="panel-sub">Drag nodes onto the canvas and connect your automation.</div></div><button class="btn primary" id="runFlow">▷ Run workflow</button></div><div class="canvas-tools"><button class="btn" data-node="Trigger">＋ Trigger</button><button class="btn" data-node="Agent">＋ Agent</button><button class="btn" data-node="Condition">＋ Condition</button><button class="btn" data-node="Tool call">＋ Tool call</button><button class="btn" data-node="Transform">＋ Transform</button><button class="btn" data-node="Loop">＋ Loop</button></div><div class="canvas" id="canvas"><div class="node" style="left:7%;top:38%"><div class="node-type">Trigger</div><b>When workflow starts</b><small>Manual / API trigger</small></div><div class="node" style="left:39%;top:38%"><div class="node-type">Agent</div><b>Research agent</b><small>Run AI agent</small></div><div class="node" style="left:72%;top:38%"><div class="node-type">Tool call</div><b>Send summary</b><small>Post to Slack</small></div><div class="connector" style="left:25%;top:47%;width:14%"></div><div class="connector" style="left:57%;top:47%;width:14%"></div></div></div>'}
function playground(){return head('Playground','Chat with your agents, test prompts and inspect tool calls.','<button class="btn">＋ New session</button>')+'<div class="editor-layout"><section class="panel chatbox"><div class="panel-head"><div><h3>Research Assistant</h3><div class="panel-sub"><span class="status">● Online</span> · GPT-4o</div></div><select class="btn"><option>Research Assistant</option>'+agents.map(a=>'<option>'+a.name+'</option>').join('')+'</select></div><div class="chat-messages" id="messages"><div class="bubble">Hello! I’m your Research Assistant. I can research topics, compare options and prepare structured reports. What would you like to explore?</div></div><div class="chat-compose"><input id="chatInput" placeholder="Message your agent..."><button class="btn primary" id="sendChat">Send ↑</button></div></section><aside class="panel"><h3>Run configuration</h3><div class="field" style="margin-top:18px"><label>Model</label><select><option>GPT-4o</option><option>Claude Sonnet</option><option>Gemini Pro</option></select></div><div class="switch-row"><span>Show reasoning</span><div class="switch"></div></div><div class="switch-row"><span>Show tool calls</span><div class="switch on"></div></div><div class="switch-row"><span>Use memory</span><div class="switch on"></div></div><div class="eyebrow" style="margin-top:24px">Session details</div><p class="panel-sub">Tokens used <b style="float:right;color:white">0</b></p><p class="panel-sub">Tool calls <b style="float:right;color:white">0</b></p></aside></div>'}
function simplePage(title,sub,items,action){return head(title,sub,action||'')+'<div class="agent-grid">'+items.map((x,i)=>'<div class="agent-card"><div class="agent-icon">'+['⌘','▤','◷','✧'][i%4]+'</div><h3>'+x[0]+'</h3><p>'+x[1]+'</p><div class="meta"><span class="status">● Available</span><button class="btn" data-action="connect">Configure →</button></div></div>').join('')+'</div>'}
function render(page){current=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('crumb').textContent=({overview:'Overview',agents:'Agents',editor:'Agent builder',workflows:'Workflows',crews:'Multi-agent crews',playground:'Playground',knowledge:'Knowledge base',integrations:'Integrations',schedules:'Schedules & triggers',store:'Agent Store',analytics:'Usage & analytics',settings:'Settings'})[page]||page;let html='';
if(page==='overview')html=dashboard();if(page==='agents')html=agentsPage();if(page==='editor')html=editor();if(page==='workflows')html=workflows();if(page==='playground')html=playground();
if(page==='crews')html=simplePage('Multi-agent crews','Orchestrate specialist agents under a manager.',[['Sales research crew','Research, qualify and enrich incoming leads.'],['Content production crew','Plan, write and review marketing content.'],['Customer success crew','Resolve requests with specialist handoffs.']],'<button class="btn primary" data-action="new-crew">＋ Create crew</button>');
if(page==='knowledge')html=simplePage('Knowledge base','Give agents reliable context from your documents and data.',[['Company handbook','PDF · 24 pages · Updated recently'],['Product documentation','Website crawl · 48 pages'],['Support FAQs','Text · 126 chunks']],'<button class="btn primary" data-action="upload">↑ Upload files</button>');
if(page==='integrations')html=simplePage('Integrations','Connect the apps and tools your agents use every day.',[['Google Drive','Files, documents and knowledge sources.'],['Slack','Send messages and notifications.'],['GitHub','Repositories, issues and pull requests.'],['Gmail','Read and send email messages.'],['Notion','Search and update workspace pages.'],['HubSpot','CRM contacts, companies and deals.']]);
if(page==='schedules')html=simplePage('Schedules & triggers','Run agents automatically on a schedule or external event.',[['Daily research digest','Every weekday at 08:00 · Asia/Kolkata'],['Lead follow-up','Webhook trigger · Active'],['Weekly analytics','Every Monday at 09:00 · Asia/Kolkata'] ],'<button class="btn primary" data-action="new-schedule">＋ Add schedule</button>');
if(page==='store')html=simplePage('Agent Store','Discover templates and accelerate your next build.',[['Sales development agent','Research prospects and prepare outreach.'],['Document analyst','Extract and structure information from files.'],['Research crew','A team of agents that researches and reviews.'],['Support assistant','Knowledge-grounded customer support.']]);
if(page==='analytics')html=head('Usage & analytics','Monitor executions, model usage and workspace activity.')+'<div class="cards">'+stat('Total runs','1,284','This month','▷')+stat('Tokens consumed','2.8M','Across all models','◈')+stat('Average latency','2.4s','↘ 12% this month','◷')+stat('Failed runs','21','1.6% failure rate','!')+'</div><div class="panel"><h3>Execution history</h3><div class="activity"><i class="dot"></i><div><strong>Research Assistant</strong><small>Completed · 4,820 tokens</small></div><time>Today, 10:42</time></div><div class="activity"><i class="dot"></i><div><strong>Lead Qualification</strong><small>Completed · 2,140 tokens</small></div><time>Today, 10:18</time></div></div>';
if(page==='settings')html=head('Workspace settings','Manage your workspace preferences, members and security.')+'<div class="editor-layout"><section class="panel"><h3>General</h3><div class="field" style="margin-top:18px"><label>Workspace name</label><input value="My workspace"></div><div class="field"><label>Default timezone</label><select><option>Asia/Kolkata (UTC+05:30)</option><option>UTC</option></select></div><div class="field"><label>Default language</label><select><option>English</option></select></div><button class="btn primary" id="saveSettings">Save changes</button></section><section class="panel"><h3>Security & access</h3>'+['Require approval for risky actions','Enable audit logging','Restrict public agent publishing'].map(x=>'<div class="switch-row"><span>'+x+'</span><div class="switch on"></div></div>').join('')+'</section></div>';
view.innerHTML=html;wire()}
function wire(){view.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>render(b.dataset.page));view.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{let a=b.dataset.action;if(a==='new-agent')render('editor');else if(a==='new-workflow')toast('New workflow canvas created');else if(a==='upload')toast('Choose files to upload — storage API not connected in demo');else toast('This demo control is ready for backend integration')});view.querySelectorAll('[data-switch]').forEach(s=>s.onclick=()=>s.classList.toggle('on'));view.querySelectorAll('[data-agent]').forEach(c=>c.onclick=()=>{let a=agents[+c.dataset.agent];render('editor');setTimeout(()=>{document.getElementById('agentName').value=a.name;document.getElementById('agentRole').value=a.role},0)});let save=document.getElementById('saveAgent');if(save)save.onclick=()=>{let n=document.getElementById('agentName').value.trim();if(!n){toast('Please enter an agent name');return}agents.unshift({name:n,role:document.getElementById('agentRole').value||'General',desc:document.getElementById('agentGoal').value||'New AI agent ready to configure.',model:'GPT-4o',status:'Draft',runs:0});toast('Agent saved as draft');render('agents')};let search=document.getElementById('agentSearch');if(search)search.oninput=()=>{let q=search.value.toLowerCase();document.getElementById('agentGrid').innerHTML=agentCards();view.querySelectorAll('[data-agent]').forEach(c=>{let a=agents[+c.dataset.agent];c.classList.toggle('hidden',!a.name.toLowerCase().includes(q))})};let filter=document.getElementById('agentFilter');if(filter)filter.onchange=()=>view.querySelectorAll('[data-agent]').forEach(c=>c.classList.toggle('hidden',filter.value!=='All agents'&&agents[+c.dataset.agent].status!==filter.value));let send=document.getElementById('sendChat');if(send)send.onclick=sendMessage;let inp=document.getElementById('chatInput');if(inp)inp.onkeydown=e=>{if(e.key==='Enter')sendMessage()};let run=document.getElementById('runFlow');if(run)run.onclick=()=>toast('Workflow demo run completed · 3/3 nodes');view.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{let c=document.getElementById('canvas'),n=document.createElement('div');n.className='node';n.style.left=(10+Math.random()*65)+'%';n.style.top=(10+Math.random()*70)+'%';n.innerHTML='<div class="node-type">'+b.dataset.node+'</div><b>New '+b.dataset.node+'</b><small>Configure node settings</small>';c.appendChild(n);makeDraggable(n)});view.querySelectorAll('.node').forEach(makeDraggable);let test=document.getElementById('testAgent');if(test)test.onclick=()=>render('playground');let settings=document.getElementById('saveSettings');if(settings)settings.onclick=()=>toast('Workspace settings saved')}
function makeDraggable(n){let start=null;n.onpointerdown=e=>{if(e.target.closest('button'))return;start={x:e.clientX,y:e.clientY,l:n.offsetLeft,t:n.offsetTop};n.setPointerCapture(e.pointerId)};n.onpointermove=e=>{if(!start)return;let r=n.parentElement.getBoundingClientRect();n.style.left=Math.max(0,Math.min(r.width-n.offsetWidth,start.l+e.clientX-start.x))+'px';n.style.top=Math.max(0,Math.min(r.height-n.offsetHeight,start.t+e.clientY-start.y))+'px'};n.onpointerup=()=>start=null}
function sendMessage(){let i=document.getElementById('chatInput'),m=i.value.trim();if(!m)return;let box=document.getElementById('messages');box.innerHTML+='<div class="bubble user">'+escapeHtml(m)+'</div><div class="bubble">I’ve received your request. This interface is running in demo mode; connect an AI provider and execution API to enable live agent responses.</div>';i.value='';box.scrollTop=box.scrollHeight}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>render(b.dataset.page));document.getElementById('helpBtn').onclick=()=>toast('AI Studio demo · Help centre coming soon');render('overview');
</script></body></html>
