s:center;justify-content:space-between;padding:0 30px;background:#0b0e14}.crumb{color:#a0a9ba}.crumb b{color:#f4f5fa}.top-actions{display:flex;gap:10px;align-items:center}.pill{border:1px solid var(--line);border-radius:20px;padding:7px 11px;color:#aeb7c7;font-size:11px}.btn{border:1px solid var(--line);background:#171d29;border-radius:8px;padding:9px 13px;font-size:12px}.btn:hover{border-color:#7660dc}.btn.primary{background:#765be8;border-color:#856df1;color:white;font-weight:600}.btn.ghost{background:transparent}.content{padding:30px;max-width:1500px;margin:auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:25px}.page-head h1{font-size:25px;margin:0 0 7px;letter-spacing:-.6px}.sub{color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}.stat,.panel,.agent-card{background:var(--panel);border:1px solid var(--line);border-radius:12px}.stat{padding:17px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.stat-value{font-size:26px;font-weight:650;margin:13px 0 5px}.positive{color:var(--green);font-size:11px}.dashboard-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px}.panel{padding:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.panel h3{font-size:14px;margin:0}.panel-sub{color:var(--muted);font-size:11px;margin-top:5px}.activity{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid #202634}.activity:first-of-type{border-top:0}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px #53cf9a66}.activity strong{font-size:12px}.activity small{display:block;color:var(--muted);margin-top:4px;font-size:11px}.activity time{margin-left:auto;color:#737e92;font-size:10px}.bars{height:145px;display:flex;align-items:end;gap:12px;padding:12px 6px 0;border-bottom:1px solid var(--line)}.bar{flex:1;background:linear-gradient(180deg,#987cff,#5e4ab9);border-radius:5px 5px 0 0;min-width:10px;opacity:.85}.bar-labels{display:flex;justify-content:space-around;color:var(--muted);font-size:10px;margin-top:8px}.agent-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.agent-card{padding:17px;cursor:pointer;transition:.15s}.agent-card:hover{border-color:#7160c7;transform:translateY(-2px)}.agent-icon{width:36px;height:36px;border-radius:10px;background:#24203b;color:#b6a6ff;display:grid;place-items:center;font-size:17px;margin-bottom:14px}.agent-card h3{margin:0 0 6px;font-size:14px}.agent-card p{color:var(--muted);font-size:11px;line-height:1.5;min-height:34px}.meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}.status{color:var(--green)}.tag{font-size:10px;color:#b7a8ff;background:#292342;border-radius:20px;padding:4px 8px}.toolbar{display:flex;gap:9px;margin-bottom:17px;align-items:center}.search{background:#111621;border:1px solid var(--line);border-radius:8px;color:white;padding:9px 12px;min-width:220px;outline:none}.search:focus,input:focus,textarea:focus,select:focus{border-color:#8069e9!important;outline:none}.editor-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:15px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{margin-bottom:15px}.field label{display:block;color:#aab4c6;font-size:11px;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;background:#0c111a;border:1px solid #2a3242;border-radius:7px;padding:10px;color:#e9edf6;font-size:12px}.field textarea{min-height:95px;resize:vertical;line-height:1.5}.field.full{grid-column:1/-1}.switch-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);font-size:12px}.switch{width:32px;height:18px;border-radius:20px;background:#394154;position:relative;cursor:pointer}.switch:after{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:white;top:3px;left:3px;transition:.15s}.switch.on{background:#7058db}.switch.on:after{left:17px}.canvas{height:540px;position:relative;overflow:hidden;background-color:#0b1018;background-image:radial-gradient(#30394a 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:12px}.node{position:absolute;width:180px;background:#171e2a;border:1px solid #39445a;border-radius:10px;padding:12px;box-shadow:0 12px 30px #0005;cursor:grab}.node b{font-size:12px}.node small{display:block;color:var(--muted);font-size:10px;margin-top:7px}.node .node-type{font-size:9px;color:#a996ff;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}.connector{position:absolute;height:2px;background:#7664c8;transform-origin:left center;opacity:.8}.canvas-tools{display:flex;gap:8px;margin-bottom:12px}.chatbox{height:460px;display:flex;flex-direction:column}.chat-messages{flex:1;overflow:auto;padding:10px}.bubble{max-width:80%;padding:12px;border-radius:10px;background:#1b2230;font-size:12px;line-height:1.55;margin:10px 0}.bubble.user{margin-left:auto;background:#342b5b}.chat-compose{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:14px}.chat-compose input{flex:1;background:#0c111a;border:1px solid var(--line);border-radius:8px;padding:11px;color:white}.empty{padding:50px;text-align:center;color:var(--muted)}.hidden{display:none!important}.toast{position:fixed;bottom:22px;right:24px;background:#202a3a;border:1px solid #46536c;padding:12px 16px;border-radius:9px;box-shadow:0 10px 30px #0008;z-index:9}.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:18px}.tabs button{background:none;border:0;color:var(--muted);padding:10px 2px;font-size:12px}.tabs button.active{color:white;border-bottom:2px solid var(--purple)}@media(max-width:1000px){.sidebar{width:205px}.cards{grid-template-columns:repeat(2,1fr)}.agent-grid{grid-template-columns:repeat(2,1fr)}.dashboard-grid,.editor-layout{grid-template-columns:1fr}}@media(max-width:700px){.sidebar{width:58px;padding:12px 7px}.brand{padding:5px 5px 20px}.brand span,.workspace,.nav-label,.nav button .nav-text,.nav .count,.profile div:not(.avatar){display:none}.nav button{justify-content:center;padding:12px 4px}.profile{justify-content:center}.topbar{padding:0 14px}.content{padding:20px 14px}.page-head{gap:12px}.cards{grid-template-columns:1fr 1fr}.agent-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}

/* expanded studio workspace */
.playground-shell{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;min-height:650px}
.playground-left{display:flex;flex-direction:column;gap:12px}
.playground-main{display:flex;flex-direction:column;min-width:0;min-height:650px}
.chatbox{height:auto;min-height:620px;border:0;background:transparent;padding:0}
.chat-stage{flex:1;min-height:470px;overflow:auto;padding:28px max(5%,calc((100% - 760px)/2));background:#0d1119;border:1px solid var(--line);border-radius:12px}
.chat-stage .bubble{font-size:14px;line-height:1.7;max-width:88%;padding:14px 16px}
.chat-stage .bubble.assistant{background:transparent;border:1px solid #273044}
.chat-compose{max-width:850px;width:100%;margin:12px auto 0;border:1px solid #343d50;border-radius:16px;padding:9px;background:#111722}
.chat-compose input{border:0;background:transparent;padding:12px}
.chat-compose button{border-radius:11px}
.mode-switch{display:flex;gap:6px;padding:5px;background:#0c111a;border:1px solid var(--line);border-radius:10px}
.mode-switch button{flex:1}
.mode-switch button.active{background:#302750;border-color:#725cce}
.workflow-mini{height:230px;background-color:#0b1018;background-image:radial-gradient(#30394a 1px,transparent 1px);background-size:20px 20px;border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden}
.workflow-mini .node{width:135px;padding:9px}
.workflow-mini .node b{font-size:10px}
.workflow-mini .node small{font-size:9px}
.section-kicker{font-size:10px;color:#a996ff;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:9px}
.resource-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.resource-row:first-of-type{border-top:0}
.resource-icon{width:34px;height:34px;border-radius:9px;background:#24203b;display:grid;place-items:center;color:#b6a6ff}
.resource-row p{margin:4px 0 0;color:var(--muted);font-size:11px}
.resource-row .btn{margin-left:auto}
.model-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.model-card{background:#111722;border:1px solid var(--line);border-radius:10px;padding:14px}
.model-card h3{font-size:13px;margin:0 0 6px}
.model-card p{font-size:11px;color:var(--muted);line-height:1.5}
.agent-kb{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kb-agent{border:1px solid var(--line);background:#111722;border-radius:10px;padding:14px}
.dropzone{border:1px dashed #555078;border-radius:12px;padding:24px;text-align:center;color:var(--muted);background:#111520}
@media(max-width:900px){.playground-shell{grid-template-columns:1fr}.playground-left{order:2}.model-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.model-grid,.agent-kb{grid-template-columns:1fr}.chat-stage{padding:14px}}
</style></head>
<body><div class="app">
<aside class="sidebar"><div class="brand"><div class="logo">✦</div><span>AI Studio</span></div>

<div class="nav-label">Manage</div>

<main class="main"><header class="topbar"><div class="crumb">Workspace <span style="color:#596477"> / </span> <b id="crumb">Overview</b></div><div class="top-actions"><span class="pill">✦ 2,450 credits</span><button class="btn ghost" id="helpBtn">? Help</button><div class="avatar">SP</div></div></header><div class="content" id="view"></div></main></div><div id="toast" class="toast hidden"></div>
<script>
const view=document.getElementById('view');let current='overview';let chatHistory=[];let agents=[{name:'Research Assistant',role:'Research',desc:'Finds, evaluates and summarizes information from trusted sources.',model:'GPT-4o',status:'Active',runs:128},{name:'Customer Support Agent',role:'Support',desc:'Answers customer questions using your help centre and knowledge base.',model:'Claude Sonnet',status:'Active',runs:94},{name:'Lead Qualification',role:'Sales',desc:'Researches incoming leads and scores them against your ideal customer profile.',model:'Gemini Pro',status:'Draft',runs:36},{name:'Content Writer',role:'Marketing',desc:'Creates clear, on-brand content for campaigns and social channels.',model:'GPT-4o',status:'Active',runs:62},{name:'Data Analyst',role:'Analytics',desc:'Turns raw data into useful insights, reports and visual summaries.',model:'GPT-4o',status:'Active',runs:41},{name:'Meeting Scheduler',role:'Operations',desc:'Coordinates calendars and prepares meeting briefs.',model:'Claude Sonnet',status:'Paused',runs:18}];
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2400)}
function head(title,sub,action=''){return '<div class="page-head"><div><h1>'+title+'</h1><div class="sub">'+sub+'</div></div>'+action+'</div>'}
function stat(label,value,delta,icon){return '<div class="stat"><div class="stat-top"><span>'+label+'</span><span>'+icon+'</span></div><div class="stat-value">'+value+'</div><div class="positive">'+delta+'</div></div>'}
function agentCards(){return agents.map((a,i)=>'<div class="agent-card" data-agent="'+i+'"><div class="agent-icon">✧</div><h3>'+a.name+'</h3><span class="tag">'+a.role+'</span><p>'+a.desc+'</p><div class="meta"><span class="'+(a.status==='Active'?'status':'')+'">● '+a.status+'</span><span>'+a.model+' · '+a.runs+' runs</span></div></div>').join('')}
function dashboard(){return head('Good evening 👋','Here’s what’s happening across your AI workspace.','<button class="btn primary" data-action="new-agent">＋ Create agent</button>')+'<div class="cards">'+stat('Total agents','06','↗ 2 created this month','✧')+stat('Executions this month','1,284','↗ 18.6% vs last month','▷')+stat('Success rate','98.4%','↗ 2.1% vs last month','✓')+stat('Credits used','12,450','↘ 8% lower than average','◈')+'</div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><div><h3>Execution activity</h3><div class="panel-sub">Agent runs over the last 7 days</div></div><button class="btn">Last 7 days⌄</button></div><div class="bars">'+[45,66,53,82,61,95,72].map(h=>'<div class="bar" style="height:'+h+'%"></div>').join('')+'</div><div class="bar-labels"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div></section><section class="panel"><div class="panel-head"><div><h3>Recent activity</h3><div class="panel-sub">Latest workspace events</div></div><button class="btn ghost">View all</button></div><div class="activity"><i class="dot"></i><div><strong>Research Assistant completed a run</strong><small>Competitor landscape report generated</small></div><time>2m ago</time></div><div class="activity"><i class="dot"></i><div><strong>Customer Support Agent</strong><small>Resolved 12 customer conversations</small></div><time>18m ago</time></div><div class="activity"><i class="dot"></i><div><strong>New integration connected</strong><small>Google Drive · Knowledge source</small></div><time>1h ago</time></div><div class="activity"><i class="dot"></i><div><strong>Weekly report workflow</strong><small>Scheduled run completed</small></div><time>3h ago</time></div></section></div><section style="margin-top:24px"><div class="panel-head"><div><h3>Your agents</h3><div class="panel-sub">Quick access to your most-used agents</div></div><button class="btn" data-page="agents">View all agents →</button></div><div class="agent-grid">'+agentCards().slice(0,agents.length>3?agents.length:3)+'</div></section>'}
function agentsPage(){return head('Agents','Create, configure and manage your AI agents.','<button class="btn primary" data-action="new-agent">＋ Create agent</button>')+'<div class="toolbar"><input class="search" id="agentSearch" placeholder="⌕  Search agents..."><select class="btn" id="agentFilter"><option>All agents</option><option>Active</option><option>Draft</option><option>Paused</option></select><span class="sub" style="margin-left:auto">'+agents.length+' agents</span></div><div class="agent-grid" id="agentGrid">'+agentCards()+'</div>'}
function editor(){return head('Create an agent','Configure the identity, behaviour, model and capabilities of your agent.','<button class="btn" data-page="agents">Cancel</button> <button class="btn primary" id="saveAgent">Save agent</button>')+'<div class="editor-layout"><section class="panel"><div class="eyebrow">01 · Identity & instructions</div><h3 style="margin:9px 0 18px">Define your agent</h3><div class="field"><label>Agent name</label><input id="agentName" placeholder="e.g. Research Assistant"></div><div class="form-grid"><div class="field"><label>Role</label><input id="agentRole" placeholder="e.g. Research analyst"></div><div class="field"><label>Goal</label><input id="agentGoal" placeholder="What should it achieve?"></div><div class="field full"><label>System instructions</label><textarea id="agentPrompt" placeholder="You are a helpful AI agent. Your job is to..."></textarea></div><div class="field full"><label>First message</label><input placeholder="Hi! How can I help you today?"></div></div><div class="eyebrow" style="margin:15px 0">02 · Model & runtime</div><div class="form-grid"><div class="field"><label>AI provider</label><select><option>OpenAI</option><option>Anthropic</option><option>Google</option><option>DeepSeek</option><option>OpenRouter</option><option>Ollama</option></select></div><div class="field"><label>Model</label><select><option>GPT-4o</option><option>GPT-4.1</option><option>Claude Sonnet</option><option>Gemini 2.5 Pro</option><option>DeepSeek R1</option></select></div><div class="field"><label>Temperature</label><input type="number" value="0.7" min="0" max="2" step=".1"></div><div class="field"><label>Max tokens</label><input type="number" value="4096"></div></div></section><aside class="panel"><div class="eyebrow">03 · Capabilities</div><h3 style="margin:9px 0 12px">Tools & memory</h3>'+['Web search','Python code execution','Long-term memory','Knowledge base (RAG)','Browser automation','Generative UI'].map((x,i)=>'<div class="switch-row"><span>'+x+'</span><div class="switch '+(i<2?'on':'')+'" data-switch></div></div>').join('')+'<div class="eyebrow" style="margin:22px 0 12px">04 · Publishing</div><div class="field"><label>Visibility</label><select><option>Private — only me</option><option>Workspace</option><option>Public Agent Store</option></select></div><button class="btn" style="width:100%" id="testAgent">▷ Test in playground</button><p class="panel-sub" style="line-height:1.6">Your agent is saved as a draft until you publish it. Connect tools and add knowledge to unlock its full capabilities.</p></aside></div>'}
function workflows(){return head('Workflows','Build deterministic automations with visual nodes, conditions and loops.','<button class="btn primary" data-action="new-workflow">＋ New workflow</button>')+'<div class="panel"><div class="panel-head"><div><h3>Visual workflow builder</h3><div class="panel-sub">Drag nodes onto the canvas and connect your automation.</div></div><button class="btn primary" id="runFlow">▷ Run workflow</button></div><div class="canvas-tools"><button class="btn" data-node="Trigger">＋ Trigger</button><button class="btn" data-node="Agent">＋ Agent</button><button class="btn" data-node="Condition">＋ Condition</button><button class="btn" data-node="Tool call">＋ Tool call</button><button class="btn" data-node="Transform">＋ Transform</button><button class="btn" data-node="Loop">＋ Loop</button></div><div class="canvas" id="canvas"><div class="node" style="left:7%;top:38%"><div class="node-type">Trigger</div><b>When workflow starts</b><small>Manual / API trigger</small></div><div class="node" style="left:39%;top:38%"><div class="node-type">Agent</div><b>Research agent</b><small>Run AI agent</small></div><div class="node" style="left:72%;top:38%"><div class="node-type">Tool call</div><b>Send summary</b><small>Post to Slack</small></div><div class="connector" style="left:25%;top:47%;width:14%"></div><div class="connector" style="left:57%;top:47%;width:14%"></div></div></div>'}
function playground(){return head('Playground','Start in a ChatGPT-style conversation. Open the workflow canvas alongside it whenever you want to orchestrate steps.','<button class="btn" id="newSession">＋ New chat</button>')+'<div class="playground-shell"><aside class="playground-left"><section class="panel"><div class="panel-head"><h3>Workspace</h3><span class="tag">Studio</span></div><button class="btn" style="width:100%;text-align:left;margin-bottom:8px" data-play-mode="chat">▤  Chat assistant</button><button class="btn" style="width:100%;text-align:left" data-play-mode="flow">⌘  Workflow canvas</button><div class="section-kicker" style="margin-top:20px">Your agents</div>'+agents.map((a,i)=>'<button class="btn" style="width:100%;text-align:left;margin:4px 0" data-select-agent="'+i+'">✧  '+escapeHtml(a.name)+'</button>').join('')+'</section><section class="panel"><div class="section-kicker">Session settings</div><div class="field"><label>Model</label><select id="playModel"><option>gpt-4o-mini</option><option>gpt-4o</option><option>gpt-4.1</option><option>claude-sonnet</option><option>gemini-2.5-pro</option><option>deepseek-chat</option></select></div><div class="switch-row"><span>Show tool activity</span><div class="switch on" data-switch></div></div><div class="switch-row"><span>Use agent knowledge</span><div class="switch on" data-switch></div></div></section></aside><section class="playground-main"><div class="panel-head"><div><h3 id="playTitle">New conversation</h3><div class="panel-sub" id="playSubtitle">General assistant · Select an agent to begin</div></div><span class="pill">● Ready to test</span></div><div class="chat-stage" id="messages"><div class="bubble assistant">Hi! What would you like to build or explore? Select an agent from the left, or start with a general conversation. You can switch to the workflow canvas at any time.</div></div><div class="chat-compose"><input id="chatInput" placeholder="Message AI Studio..."><button class="btn primary" id="sendChat">↑</button></div><div class="panel-sub" style="text-align:center;margin-top:10px">AI responses may be inaccurate. Review outputs before using them.</div></section></div>'}

function toolsPage(){return head('Tools & models','Choose the model that powers an agent and connect the tools it can call.')+'<section class="panel" style="margin-bottom:16px"><div class="panel-head"><div><h3>Model catalog</h3><div class="panel-sub">Provider and model options. Availability depends on configured API credentials.</div></div><span class="tag">Model routing</span></div><div class="model-grid">'+[['OpenAI','GPT-4o · GPT-4.1 · GPT-4o mini','Reasoning, multimodal and fast general-purpose models.'],['Anthropic','Claude Sonnet · Claude Haiku','Strong writing, analysis and tool use.'],['Google','Gemini 2.5 Pro · Flash','Long-context and multimodal workloads.'],['DeepSeek','DeepSeek Chat · Reasoner','Cost-aware chat and reasoning options.'],['OpenRouter','200+ hosted models','Unified access to multiple model providers.'],['Ollama','Local models','Connect self-hosted models where network access permits.']].map(x=>'<div class="model-card"><div class="section-kicker">'+x[0]+'</div><h3>'+x[1]+'</h3><p>'+x[2]+'</p><button class="btn" data-action="configure-model">Configure provider →</button></div>').join('')+'</div></section><section class="panel"><div class="panel-head"><div><h3>Tool connections</h3><div class="panel-sub">Expose capabilities to agents with least-privilege access.</div></div><button class="btn primary" data-action="add-mcp">＋ Add MCP server</button></div>'+[['MCP servers','Connect Model Context Protocol servers and their callable tools.'],['OpenAPI / Swagger','Import an API schema and expose selected endpoints as tools.'],['Built-in tools','Web search, browser, code execution, OCR and document parsing.'],['Composio apps','OAuth connections to business apps and SaaS tools.'],['Webhooks','Trigger agents from external events and callbacks.']].map(x=>'<div class="resource-row"><div class="resource-icon">⌘</div><div><b>'+x[0]+'</b><p>'+x[1]+'</p></div><button class="btn" data-action="configure-tool">Configure</button></div>').join('')+'</section>'}
function knowledgePage(){return head('Knowledge base','Upload documents, crawl websites or add text. Attach one or more knowledge collections to each agent.','<button class="btn primary" data-action="upload">＋ Add knowledge</button>')+'<section class="panel" style="margin-bottom:16px"><div class="dropzone"><div style="font-size:25px">↑</div><b>Add knowledge sources</b><p>PDF, DOCX, TXT, CSV, website URLs or pasted text</p><button class="btn primary" data-action="upload">Choose files / source</button></div></section><section class="panel"><div class="panel-head"><div><h3>Knowledge assigned to agents</h3><div class="panel-sub">Each agent has its own selected knowledge sources.</div></div><button class="btn" data-action="manage-kb">Manage collections</button></div><div class="agent-kb">'+agents.map((a,i)=>'<div class="kb-agent"><b>✧ '+escapeHtml(a.name)+'</b><p class="panel-sub">Assigned sources: '+(i===0?'Company handbook, Product docs':i===1?'Support FAQs':'None yet')+'</p><button class="btn" data-kb-agent="'+i+'">＋ Attach knowledge</button></div>').join('')+'</div></section>'}
function integrationsPage(){return head('Integrations','Manage external apps, MCP servers, API specifications and event triggers.','<button class="btn primary" data-action="add-integration">＋ Add connection</button>')+'<div class="tabs"><button class="active">All</button><button>MCP servers</button><button>Apps</button><button>API / OpenAPI</button><button>Webhooks</button></div><div class="agent-grid">'+[['MCP servers','Connect custom MCP endpoints and choose tools per agent.'],['Google Drive','Search files and use documents as knowledge.'],['Slack','Send messages and respond to events.'],['GitHub','Work with repositories, issues and pull requests.'],['Gmail','Read, draft and send email.'],['Notion','Search and update workspace pages.'],['OpenAPI / Swagger','Import endpoints as callable agent tools.'],['Webhooks & triggers','Wake agents from external services.']].map((x,i)=>'<div class="agent-card"><div class="agent-icon">'+['⌘','▣','◉','⌁'][i%4]+'</div><h3>'+x[0]+'</h3><p>'+x[1]+'</p><div class="meta"><span>Not connected</span><button class="btn" data-action="configure-integration">Connect →</button></div></div>').join('')+'</div>'}
function drivePage(){return head('Agent Drive','A shared file space for generated artifacts, reports and files used by your agents.','<button class="btn primary" data-action="drive-upload">↑ Upload file</button>')+'<section class="panel"><div class="toolbar"><input class="search" placeholder="⌕ Search files..."><select class="btn"><option>All files</option><option>Documents</option><option>Spreadsheets</option><option>Presentations</option></select><span class="sub" style="margin-left:auto">Workspace storage · Demo view</span></div>'+[['📄','Research brief.pdf','Research Assistant · PDF · 1.2 MB'],['▦','Lead scoring.xlsx','Lead Qualification · XLSX · 340 KB'],['▤','Campaign plan.docx','Content Writer · DOCX · 820 KB']].map(x=>'<div class="resource-row"><div class="resource-icon">'+x[0]+'</div><div><b>'+x[1]+'</b><p>'+x[2]+'</p></div><button class="btn" data-action="open-file">Open</button></div>').join('')+'</section>'}
function docsPage(){return head('Developer docs & API','Build with the API, inspect usage and configure secure access.','<button class="btn primary" data-action="api-keys">＋ Create API key</button>')+'<div class="agent-grid">'+[['Quick start','Create an agent, configure a model and run a test conversation.'],['API reference','Endpoints for agents, workflows, runs and knowledge sources.'],['Webhooks','Receive run-completed events and trigger agents externally.'],['MCP development','Connect an MCP server or import OpenAPI tools.'],['SDKs & examples','Request examples, authentication and integration patterns.'],['Audit & tracing','Inspect executions, tool calls, errors and request metadata.']].map((x,i)=>'<div class="agent-card"><div class="agent-icon">⌘</div><h3>'+x[0]+'</h3><p>'+x[1]+'</p><div class="meta"><span>Developer resource</span><button class="btn" data-action="open-docs">Read guide →</button></div></div>').join('')+'<section class="panel" style="grid-column:1/-1"><h3>API access</h3><p class="panel-sub">API keys and endpoint access should be configured securely on the server. Never paste secret keys into frontend code.</p><code>POST /api/agents · POST /api/chat · GET /api/health</code></section></div>'}
function billingPage(){return head('Plans & billing','Review your plan, usage allowance and payment settings.')+'<div class="cards">'+stat('Current plan','Free','No subscription charge','◈')+stat('Monthly usage','2,450','Illustrative credits used','▥')+stat('Included seats','1','Workspace owner','♙')+stat('Next reset','Monthly','Usage cycle','◷')+'</div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><h3>Free workspace</h3><span class="tag">Current plan</span></div><p class="panel-sub">Core agent building, playground testing and basic workflow design. External model providers may charge separately for API usage.</p><button class="btn" data-action="plan-details">View plan details</button></section><section class="panel"><h3>Usage & cost controls</h3><div class="switch-row"><span>Usage alerts</span><div class="switch on" data-switch></div></div><div class="switch-row"><span>Require approval for paid tools</span><div class="switch on" data-switch></div></div><div class="switch-row"><span>Monthly spend limit</span><b>Not configured</b></div></section></div><p class="panel-sub" style="margin-top:16px">Billing and payment processing are not connected in this starter. No payment method is collected here.</p>}

function simplePage(title,sub,items,action){return head(title,sub,action||'')+'<div class="agent-grid">'+items.map((x,i)=>'<div class="agent-card"><div class="agent-icon">'+['⌘','▤','◷','✧'][i%4]+'</div><h3>'+x[0]+'</h3><p>'+x[1]+'</p><div class="meta"><span class="status">● Available</span><button class="btn" data-action="connect">Configure →</button></div></div>').join('')+'</div>'}
function render(page){current=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('crumb').textContent=({overview:'Overview',agents:'Agents',editor:'Agent builder',workflows:'Workflows',crews:'Multi-agent crews',playground:'Playground',knowledge:'Knowledge base',integrations:'Integrations',schedules:'Schedules & triggers',store:'Agent Store',analytics:'App usage',settings:'Settings',tools:'Tools & models',drive:'Agent Drive',docs:'Docs & API',billing:'Plans & billing'})[page]||page;let html='';
if(page==='tools')html=toolsPage();if(page==='drive')html=drivePage();if(page==='docs')html=docsPage();if(page==='billing')html=billingPage();if(page==='overview')html=dashboard();if(page==='agents')html=agentsPage();if(page==='editor')html=editor();if(page==='workflows')html=workflows();if(page==='playground')html=playground();
if(page==='crews')html=simplePage('Multi-agent crews','Orchestrate specialist agents under a manager.',[['Sales research crew','Research, qualify and enrich incoming leads.'],['Content production crew','Plan, write and review marketing content.'],['Customer success crew','Resolve requests with specialist handoffs.']],'<button class="btn primary" data-action="new-crew">＋ Create crew</button>');
if(page==='knowledge')html=knowledgePage();
if(page==='integrations')html=integrationsPage();
if(page==='schedules')html=simplePage('Schedules & triggers','Run agents automatically on a schedule or external event.',[['Daily research digest','Every weekday at 08:00 · Asia/Kolkata'],['Lead follow-up','Webhook trigger · Active'],['Weekly analytics','Every Monday at 09:00 · Asia/Kolkata'] ],'<button class="btn primary" data-action="new-schedule">＋ Add schedule</button>');
if(page==='store')html=simplePage('Agent Store','Discover templates and accelerate your next build.',[['Sales development agent','Research prospects and prepare outreach.'],['Document analyst','Extract and structure information from files.'],['Research crew','A team of agents that researches and reviews.'],['Support assistant','Knowledge-grounded customer support.']]);
if(page==='analytics')html=head('Usage & analytics','Monitor executions, model usage and workspace activity.')+'<div class="cards">'+stat('Total runs','1,284','This month','▷')+stat('Tokens consumed','2.8M','Across all models','◈')+stat('Average latency','2.4s','↘ 12% this month','◷')+stat('Failed runs','21','1.6% failure rate','!')+'</div><div class="panel"><h3>Execution history</h3><div class="activity"><i class="dot"></i><div><strong>Research Assistant</strong><small>Completed · 4,820 tokens</small></div><time>Today, 10:42</time></div><div class="activity"><i class="dot"></i><div><strong>Lead Qualification</strong><small>Completed · 2,140 tokens</small></div><time>Today, 10:18</time></div></div>';
if(page==='settings')html=head('Workspace settings','Manage your workspace preferences, members and security.')+'<div class="editor-layout"><section class="panel"><h3>General</h3><div class="field" style="margin-top:18px"><label>Workspace name</label><input value="My workspace"></div><div class="field"><label>Default timezone</label><select><option>Asia/Kolkata (UTC+05:30)</option><option>UTC</option></select></div><div class="field"><label>Default language</label><select><option>English</option></select></div><button class="btn primary" id="saveSettings">Save changes</button></section><section class="panel"><h3>Security & access</h3>'+['Require approval for risky actions','Enable audit logging','Restrict public agent publishing'].map(x=>'<div class="switch-row"><span>'+x+'</span><div class="switch on"></div></div>').join('')+'</section></div>';
view.innerHTML=html;wire()}
function wire(){view.querySelectorAll('[data-play-mode]').forEach(b=>b.onclick=()=>{if(b.dataset.playMode==='flow'){render('workflows')}else{render('playground')}});view.querySelectorAll('[data-select-agent]').forEach(b=>b.onclick=()=>{let a=agents[+b.dataset.selectAgent];document.getElementById('playTitle').textContent=a.name;document.getElementById('playSubtitle').textContent=a.role+' · '+a.model;document.getElementById('messages').innerHTML='<div class="bubble assistant">You are chatting with '+escapeHtml(a.name)+'. What would you like to work on?</div>';let sel=document.getElementById('playAgent');if(sel)sel.value=a.id||''});view.querySelectorAll('[data-kb-agent]').forEach(b=>b.onclick=()=>toast('Knowledge assignment UI selected for '+agents[+b.dataset.kbAgent].name+' · storage API not connected'));let ns=document.getElementById('newSession');if(ns)ns.onclick=()=>{chatHistory=[];document.getElementById('messages').innerHTML='<div class="bubble assistant">New conversation started. How can I help?</div>'};view.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>render(b.dataset.page));view.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{let a=b.dataset.action;if(a==='new-agent')render('editor');else if(a==='new-workflow')toast('New workflow canvas created');else if(a==='upload')toast('Choose files to upload — storage API not connected in demo');else toast('This demo control is ready for backend integration')});view.querySelectorAll('[data-switch]').forEach(s=>s.onclick=()=>s.classList.toggle('on'));view.querySelectorAll('[data-agent]').forEach(c=>c.onclick=()=>{let a=agents[+c.dataset.agent];render('editor');setTimeout(()=>{document.getElementById('agentName').value=a.name;document.getElementById('agentRole').value=a.role},0)});let save=document.getElementById('saveAgent');if(save)save.onclick=async()=>{let n=document.getElementById('agentName').value.trim();if(!n){toast('Please enter an agent name');return}try{let r=await fetch('/api/agents',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:n,role:document.getElementById('agentRole').value,goal:document.getElementById('agentGoal').value,instructions:document.getElementById('agentPrompt').value})});let d=await r.json();if(!r.ok)throw new Error(d.error||'Could not save agent');let a=d.agent;agents.unshift({id:a.id,name:a.name,role:a.role,desc:a.goal||'New AI agent ready to configure.',model:a.model,status:a.status,runs:a.runs});toast('Agent saved to workspace');render('agents')}catch(e){toast(e.message)}};let search=document.getElementById('agentSearch');if(search)search.oninput=()=>{let q=search.value.toLowerCase();document.getElementById('agentGrid').innerHTML=agentCards();view.querySelectorAll('[data-agent]').forEach(c=>{let a=agents[+c.dataset.agent];c.classList.toggle('hidden',!a.name.toLowerCase().includes(q))})};let filter=document.getElementById('agentFilter');if(filter)filter.onchange=()=>view.querySelectorAll('[data-agent]').forEach(c=>c.classList.toggle('hidden',filter.value!=='All agents'&&agents[+c.dataset.agent].status!==filter.value));let send=document.getElementById('sendChat');if(send)send.onclick=sendMessage;let inp=document.getElementById('chatInput');if(inp)inp.onkeydown=e=>{if(e.key==='Enter')sendMessage()};let run=document.getElementById('runFlow');if(run)run.onclick=()=>toast('Workflow demo run completed · 3/3 nodes');view.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{let c=document.getElementById('canvas'),n=document.createElement('div');n.className='node';n.style.left=(10+Math.random()*65)+'%';n.style.top=(10+Math.random()*70)+'%';n.innerHTML='<div class="node-type">'+b.dataset.node+'</div><b>New '+b.dataset.node+'</b><small>Configure node settings</small>';c.appendChild(n);makeDraggable(n)});view.querySelectorAll('.node').forEach(makeDraggable);let test=document.getElementById('testAgent');if(test)test.onclick=()=>render('playground');let settings=document.getElementById('saveSettings');if(settings)settings.onclick=()=>toast('Workspace settings saved')}
function makeDraggable(n){let start=null;n.onpointerdown=e=>{if(e.target.closest('button'))return;start={x:e.clientX,y:e.clientY,l:n.offsetLeft,t:n.offsetTop};n.setPointerCapture(e.pointerId)};n.onpointermove=e=>{if(!start)return;let r=n.parentElement.getBoundingClientRect();n.style.left=Math.max(0,Math.min(r.width-n.offsetWidth,start.l+e.clientX-start.x))+'px';n.style.top=Math.max(0,Math.min(r.height-n.offsetHeight,start.t+e.clientY-start.y))+'px'};n.onpointerup=()=>start=null}
async function sendMessage(){let i=document.getElementById('chatInput'),m=i.value.trim();if(!m)return;let box=document.getElementById('messages');box.innerHTML+='<div class="bubble user">'+escapeHtml(m)+'</div>';i.value='';box.scrollTop=box.scrollHeight;try{let selected=document.getElementById('playAgent');let r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:m,history:chatHistory,agentId:selected?.value||null,model:document.getElementById('playModel')?.value||'gpt-4o-mini'})});let d=await r.json();if(!r.ok)throw new Error(d.error||'AI request failed');chatHistory.push({role:'user',content:m},{role:'assistant',content:d.reply});chatHistory=chatHistory.slice(-20);box.innerHTML+='<div class="bubble">'+escapeHtml(d.reply).replace(/\\n/g,'<br>')+'</div>'}catch(e){box.innerHTML+='<div class="bubble" style="border:1px solid #8b5660;color:#ffc3c8">'+escapeHtml(e.message)+'</div>'}box.scrollTop=box.scrollHeight}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>render(b.dataset.page));document.getElementById('helpBtn').onclick=()=>toast('AI Studio · Help centre coming soon');render('overview');(async()=>{try{let r=await fetch('/api/agents');if(!r.ok)return;let d=await r.json();if(d.agents?.length){agents=d.agents.map(a=>({id:a.id,name:a.name,role:a.role,desc:a.goal||'AI agent',model:a.model,status:a.status,runs:a.runs||0}));if(current==='overview'||current==='agents')render(current)}}catch(e){console.warn('API unavailable',e)}})();
</script></body></html>
