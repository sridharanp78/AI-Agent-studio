services:
  - type: web
    name: ai-agent-studio
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: APP_ACCESS_USER
        sync: false
      - key: APP_ACCESS_PASSWORD
        sync: false
